<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cognis suggestion</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="beside">
    <div class="frame">
      <header class="bar" data-tauri-drag-region>
        <span class="brand" data-tauri-drag-region>
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor" /><path d="M21.5 11.2a7 7 0 1 0 0 9.6" fill="none" stroke="var(--bg)" stroke-width="3" stroke-linecap="round" /><circle cx="21.6" cy="16" r="1.8" fill="var(--bg)" /></svg>
          From your library
        </span>
        <button class="ghost close" id="dismiss" type="button" aria-label="Dismiss suggestion">✕</button>
      </header>
      <main class="beside-body">
        <p class="why" id="why"></p>
        <ul class="cards" id="cards" aria-label="Suggested saved items"></ul>
        <div class="beside-actions">
          <button class="ghost" id="useful" type="button">Useful</button>
          <button class="ghost" id="not-useful" type="button">Not useful</button>
          <span class="spacer"></span>
          <button class="primary" id="ask" type="button">Ask about this</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/beside.ts"></script>
  </body>
</html>
