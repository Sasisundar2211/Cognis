[package]
name = "cognis-desktop"
version = "0.2.0"
description = "Cognis desktop companion: summon with a hotkey, ask your saved knowledge."
edition = "2021"
publish = false

[lib]
name = "cognis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3.34"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
url = "2.5.9"
tokio = { version = "1", features = ["sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
